# deploy/rbac.yaml
apiVersion: v1
kind: ServiceAccount
metadata:
  name: issue-controller
  namespace: claude-agent
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: issue-controller
  namespace: claude-agent
rules:
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [create, get, list, watch, delete]
  - apiGroups: []
    resources: [configmaps]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: issue-controller
  namespace: claude-agent
subjects:
  - kind: ServiceAccount
    name: issue-controller
    namespace: claude-agent
roleRef:
  kind: Role
  name: issue-controller
  apiGroup: rbac.authorization.k8s.io
